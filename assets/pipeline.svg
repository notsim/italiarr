<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="880" height="300" rx="20" fill="#f8fafc"/>

  <!-- step 1 -->
  <rect x="20" y="90" width="150" height="120" rx="16" fill="#fff" stroke="#7c4dff" stroke-width="2.5"/>
  <circle cx="60" cy="125" r="15" fill="#7c4dff"/>
  <text x="60" y="131" text-anchor="middle" font-size="15" font-weight="800" fill="#fff">1</text>
  <text x="95" y="130" font-size="14" font-weight="700" fill="#0f172a">Cerchi</text>
  <text x="95" y="150" font-size="11" fill="#64748b">canzoni, album, playlist</text>
  <text x="95" y="166" font-size="11" fill="#64748b">su YouTube Music e</text>
  <text x="95" y="182" font-size="11" fill="#64748b">YouTube (anche brani</text>
  <text x="95" y="198" font-size="11" fill="#64748b">solo-YouTube)</text>

  <!-- step 2 -->
  <rect x="250" y="90" width="170" height="120" rx="16" fill="#fff" stroke="#22d3ee" stroke-width="2.5"/>
  <circle cx="290" cy="125" r="15" fill="#0ea5e9"/>
  <text x="290" y="131" text-anchor="middle" font-size="15" font-weight="800" fill="#fff">2</text>
  <text x="325" y="130" font-size="14" font-weight="700" fill="#0f172a">Scarichi</text>
  <text x="325" y="150" font-size="11" fill="#64748b">coda intelligente:</text>
  <text x="325" y="166" font-size="11" fill="#64748b">3 download in parallelo</text>
  <text x="325" y="182" font-size="11" fill="#64748b">che non saturano il</text>
  <text x="325" y="198" font-size="11" fill="#64748b">disco/RAM</text>

  <!-- step 3 -->
  <rect x="500" y="90" width="170" height="120" rx="16" fill="#fff" stroke="#f59e0b" stroke-width="2.5"/>
  <circle cx="540" cy="125" r="15" fill="#f59e0b"/>
  <text x="540" y="131" text-anchor="middle" font-size="15" font-weight="800" fill="#fff">3</text>
  <text x="575" y="130" font-size="14" font-weight="700" fill="#0f172a">Ascolti</text>
  <text x="575" y="150" font-size="11" fill="#64748b">in Navidrome con</text>
  <text x="575" y="166" font-size="11" fill="#64748b">testi sincronizzati,</text>
  <text x="575" y="182" font-size="11" fill="#64748b">copertine e playlist</text>
  <text x="575" y="198" font-size="11" fill="#64748b">"Aggiunti di recente"</text>

  <!-- step 4 -->
  <rect x="750" y="90" width="110" height="120" rx="16" fill="#fff" stroke="#4ade80" stroke-width="2.5"/>
  <circle cx="790" cy="125" r="15" fill="#16a34a"/>
  <text x="790" y="131" text-anchor="middle" font-size="15" font-weight="800" fill="#fff">4</text>
  <text x="805" y="150" font-size="13" font-weight="700" fill="#0f172a">Oppure...</text>
  <text x="805" y="170" font-size="11" fill="#64748b">lascia che sia</text>
  <text x="805" y="186" font-size="11" fill="#64748b">music_auto a</text>
  <text x="805" y="202" font-size="11" fill="#64748b">scoprire musica</text>

  <!-- frecce -->
  <line x1="170" y1="150" x2="245" y2="150" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#a2)"/>
  <line x1="420" y1="150" x2="495" y2="150" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#a2)"/>
  <line x1="670" y1="150" x2="745" y2="150" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#a2)"/>

  <!-- output -->
  <rect x="150" y="240" width="580" height="42" rx="12" fill="#0f172a"/>
  <text x="440" y="267" text-anchor="middle" font-size="13" font-weight="600" fill="#cbd5e1">Risultato: MP3 320kbps  •  ID3 tag corretti  •  copertina integrata  •  testi .lrc sincronizzati</text>
</svg>
